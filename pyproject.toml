[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "live: calls the live OpenAI API",
  "eval: runs cost-capped quality evaluations",
  "storage: requires a storage service or emulator",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
